<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Emergency SmartBeacon – Viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100%; width: 100%; }
    .info {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15); font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      max-width: calc(100% - 40px);
    }
    .info h1 { font-size: 16px; margin: 0 0 8px; }
    .info .row { font-size: 13px; color: #333; margin: 3px 0; }
    .pill { display:inline-block; padding:2px 8px; border-radius:999px; background:#eee; margin-left:6px; font-size:12px; }
    a.btn { display:inline-block; padding:6px 10px; border-radius:8px; background:#2a7bf6; color:#fff; text-decoration:none; font-weight:600; }
    a.btn:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">
    <h1>Emergency SmartBeacon – Track</h1>
    <div class="row">Points: <span id="ptCount">0</span>
      <span class="pill" id="accPill" style="display:none">±<span id="accVal"></span> m</span>
      <span class="pill" id="batPill" style="display:none"><span id="batVal"></span>%</span>
    </div>
    <div class="row" id="tsRow" style="display:none">Time: <span id="tsVal"></span></div>
    <div class="row" id="coordsRow" style="display:none">
      End: <span id="coordsVal"></span>
      <a class="btn" id="gmapsBtn" target="_blank" rel="noopener">Open in Maps</a>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    const params = new URLSearchParams(location.search);
    const enc = params.get('p') || '';
    const ts  = params.get('ts') || '';
    const bat = params.get('bat') || '';
    const acc = params.get('acc') || '';

    function decodePolyline(encoded) {
      if (!encoded) return [];
      let index = 0, lat = 0, lng = 0, coords = [];
      while (index < encoded.length) {
        let b, shift = 0, result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;
        shift = 0; result = 0;
        do { b = encoded.charCodeAt(index++) - 63; result |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
        const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;
        coords.push([lat * 1e-5, lng * 1e-5]);
      }
      return coords;
    }

    const points = decodePolyline(enc);
    const map = L.map('map', { zoomControl: true });
    const tiles = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let end = null;
    if (points.length > 0) {
      const latlngs = points.map(p => L.latLng(p[0], p[1]));
      if (latlngs.length > 1) {
        const poly = L.polyline(latlngs, { weight: 5 }).addTo(map);
        map.fitBounds(poly.getBounds(), { padding: [30,30] });
        end = latlngs[latlngs.length - 1];
        L.circleMarker(latlngs[0], { radius:5, color:'#2a7bf6' }).addTo(map).bindPopup('Start');
        L.circleMarker(end, { radius:6, color:'#e53935' }).addTo(map).bindPopup('End');
      } else {
        end = latlngs[0];
        L.circleMarker(end, { radius:6, color:'#e53935' }).addTo(map).bindPopup('Point');
        map.setView(end, 16);
      }
    } else {
      map.setView([48.15, 17.11], 6);
    }

    document.getElementById('ptCount').textContent = String(points.length);
    if (acc) { document.getElementById('accVal').textContent = acc; document.getElementById('accPill').style.display='inline-block'; }
    if (bat) { document.getElementById('batVal').textContent = bat; document.getElementById('batPill').style.display='inline-block'; }
    if (ts)  { document.getElementById('tsVal').textContent = ts; document.getElementById('tsRow').style.display='block'; }
    if (end) {
      const lat = end.lat.toFixed(6), lng = end.lng.toFixed(6);
      const q = `${lat},${lng}`;
      document.getElementById('coordsVal').textContent = q;
      document.getElementById('gmapsBtn').href = `https://maps.google.com/?q=${encodeURIComponent(q)}`;
      document.getElementById('coordsRow').style.display = 'block';
    }

    // locate + directions UI
    (function(){
      const ctl = L.control({position:'topright'});
      ctl.onAdd = function () {
        const div = L.DomUtil.create('div','leaflet-bar');
        div.style.background = 'white';
        div.style.padding = '4px';
        div.style.borderRadius = '6px';
        div.style.boxShadow = '0 1px 4px rgba(0,0,0,0.3)';

        const locBtn = L.DomUtil.create('a', '', div);
        locBtn.href = '#'; locBtn.title = 'Show my location';
        locBtn.textContent = '📍';
        locBtn.style.display = 'inline-block';
        locBtn.style.padding = '6px';

        const dirBtn = L.DomUtil.create('a', '', div);
        dirBtn.href = '#'; dirBtn.title = 'Directions to end';
        dirBtn.textContent = '➡️';
        dirBtn.style.display = 'inline-block';
        dirBtn.style.padding = '6px';
        dirBtn.style.marginLeft = '4px';

        L.DomEvent.on(locBtn, 'click', function(e){
          L.DomEvent.stopPropagation(e); L.DomEvent.preventDefault(e);
          if (!navigator.geolocation) { alert('Geolocation not supported'); return; }
          navigator.geolocation.getCurrentPosition(function(pos){
            const lat = pos.coords.latitude, lng = pos.coords.longitude;
            if (window._myLocMarker) { window._myLocMarker.setLatLng([lat,lng]); }
            else { window._myLocMarker = L.circleMarker([lat,lng], { radius:6, color:'#1976d2' }).addTo(map).bindPopup('You are here') }
            map.setView([lat,lng], 15);
          }, function(err){
            alert('Cannot get location: ' + (err.message || err.code));
          }, {enableHighAccuracy:true, timeout:10000});
        });

        L.DomEvent.on(dirBtn, 'click', function(e){
          L.DomEvent.stopPropagation(e); L.DomEvent.preventDefault(e);
          if (!end) { alert('No target point to navigate to'); return; }
          const dest = `${end.lat.toFixed(6)},${end.lng.toFixed(6)}`;
          const url = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=walking`;
          window.open(url, '_blank');
        });

        return div;
      };
      ctl.addTo(map);
    })();
  </script>
</body>
</html>
